<div
  class="duck-avatar"
  [attr.data-mood]="mood()"
  [attr.data-animation]="animation()"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  @switch (mood()) {
    @case ('welcoming') {
      <svg
        class="duck-avatar__svg duck-avatar__svg--welcoming"
        viewBox="0 0 160 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <!-- Pattes -->
        <path
          class="duck-avatar__leg"
          d="M 60 135 L 60 148 L 68 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          class="duck-avatar__leg"
          d="M 85 135 L 85 148 L 93 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Corps et Queue -->
        <path
          class="duck-avatar__tail"
          d="M 35 115 Q 15 105 20 85 Q 35 90 45 95 Z"
          fill="#ffd54a"
        />
        <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

        <!-- Aile levée pour saluer -->
        <path
          class="duck-avatar__wing"
          d="M 60 95 Q 40 65 65 60 Q 75 75 65 95 Z"
          fill="#ffd54a"
          stroke="#f59e0b"
          stroke-width="3"
          stroke-linejoin="round"
        />

        <!-- Lignes de mouvement de l'aile -->
        <path
          class="duck-avatar__sparkle"
          d="M 42 62 L 50 68 M 38 72 L 48 76"
          stroke="#111827"
          stroke-width="2"
          stroke-linecap="round"
          fill="none"
        />

        <!-- Tête et visage -->
        <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

        <!-- Bec avec grand sourire -->
        <path
          class="duck-avatar__beak"
          d="M 110 58 C 128 58 138 62 134 70 C 130 82 115 82 106 74 C 103 66 103 60 110 58 Z"
          fill="#f59e0b"
        />
        <path class="duck-avatar__mouth" d="M 108 67 C 115 78 128 78 132 68 Z" fill="#111827" />

        <!-- Yeux ronds et brillants -->
        <circle class="duck-avatar__eye" cx="90" cy="56" r="5" fill="#111827" />
        <circle class="duck-avatar__sparkle" cx="91.5" cy="54.5" r="1.5" fill="#ffffff" />
        <circle class="duck-avatar__eye" cx="112" cy="56" r="5" fill="#111827" />
        <circle class="duck-avatar__sparkle" cx="113.5" cy="54.5" r="1.5" fill="#ffffff" />

        <!-- Sourcils levés -->
        <path
          class="duck-avatar__brow"
          d="M 85 48 Q 90 45 95 48"
          fill="none"
          stroke="#111827"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          class="duck-avatar__brow"
          d="M 107 48 Q 112 45 117 48"
          fill="none"
          stroke="#111827"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    }

    @case ('curious') {
      <svg
        class="duck-avatar__svg duck-avatar__svg--curious"
        viewBox="0 0 160 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <!-- Point d'interrogation flottant -->
        <path
          class="duck-avatar__question-mark"
          d="M 40 35 C 40 25 55 25 55 35 C 55 42 48 44 48 52 M 48 60 L 48 62"
          stroke="#111827"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />

        <!-- Pattes -->
        <path
          class="duck-avatar__leg"
          d="M 60 135 L 60 148 L 68 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          class="duck-avatar__leg"
          d="M 85 135 L 85 148 L 93 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Corps et Queue -->

          d="M 35 115 Q 15 105 20 85 Q 35 90 45 95 Z"
          fill="#ffd54a"
        />
        <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

        <!-- Aile au repos -->
        <path
          class="duck-avatar__wing"
          d="M 50 95 C 40 115, 60 125, 80 115"
          fill="none"
          stroke="#f59e0b"
          stroke-width="4"
          stroke-linecap="round"
        />

        <!-- Tête et visage avec légère inclinaison -->
        <g class="duck-avatar__head-group" transform="rotate(8, 95, 65)">
          <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

          <!-- Bec -->
          <path
            class="duck-avatar__beak"
            d="M 110 60 C 125 60 135 62 132 68 C 128 74 115 74 108 72 C 105 66 105 62 110 60 Z"
            fill="#f59e0b"
          />
          <!-- Petit sourire en coin (Smirk) -->
          <path
            class="duck-avatar__smirk"
            d="M 108 68 C 115 68 122 66 128 64"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />

          <!-- Œil gauche agrandi, œil droit normal -->
          <circle class="duck-avatar__eye" cx="90" cy="58" r="6" fill="#111827" />
          <circle class="duck-avatar__sparkle" cx="91" cy="55" r="2" fill="#ffffff" />
          <circle class="duck-avatar__eye" cx="112" cy="58" r="3.5" fill="#111827" />

          <!-- Sourcil levé d'un côté -->
          <path
            class="duck-avatar__brow"
            d="M 84 45 Q 90 40 96 45"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
          <path
            class="duck-avatar__brow"
            d="M 108 51 L 116 51"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
        </g>
      </svg>
    }

    @case ('thinking') {
      <svg
        class="duck-avatar__svg duck-avatar__svg--thinking"

        <circle

        <circle class="duck-avatar__thought-dot" cx="70" cy="33" r="1.5" fill="#111827" />
        <circle class="duck-avatar__thought-dot" cx="80" cy="33" r="1.5" fill="#111827" />

          stroke-width="5"
          fill="none"

        <path

          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Corps et Queue -->
        <path
          class="duck-avatar__tail"
          d="M 35 115 Q 15 105 20 85 Q 35 90 45 95 Z"

        />
        <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

          stroke-linecap="round"
        />

        <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

        <!-- Bec plat -->
        <path
          class="duck-avatar__beak"
          d="M 110 60 C 125 60 135 62 132 68 C 128 74 115 74 108 72 C 105 66 105 62 110 60 Z"
          fill="#f59e0b"
        />
        <path
          class="duck-avatar__mouth"
          d="M 108 68 L 125 68"
          stroke="#111827"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
        />

        <!-- Yeux regardant vers le haut -->
        <circle
          class="duck-avatar__eye-outer"

          cy="58"
          r="5"
          fill="#ffffff"
          stroke="#111827"
          stroke-width="1.5"
        />
        <circle class="duck-avatar__pupil" cx="88" cy="56" r="2.5" fill="#111827" />
        <circle

          r="5"
          fill="#ffffff"
          stroke="#111827"
          stroke-width="1.5"
        />

        <!-- Sourcils froncés -->

          d="M 84 48 L 94 51"
          stroke="#111827"
          stroke-width="2"
          stroke-linecap="round"

        <path
          class="duck-avatar__brow"
          d="M 116 48 L 106 51"
          stroke="#111827"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    }

    @case ('sarcastic') {

          />
          <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

          <!-- Aile -->
          <path
            class="duck-avatar__wing"
            d="M 50 95 C 40 115, 60 125, 80 115"
            fill="none"
            stroke="#f59e0b"

            stroke-linecap="round"
          />

          <!-- Tête -->
          <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

          <!-- Bec avec Smirk asymétrique -->
          <path
            class="duck-avatar__beak"
            d="M 110 60 C 125 60 135 62 132 68 C 128 74 115 74 108 72 C 105 66 105 62 110 60 Z"
            fill="#f59e0b"
          />
          <path
            class="duck-avatar__smirk"
            d="M 108 68 C 115 69 125 67 130 62"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />

          <!-- Yeux mi-clos -->
          <path class="duck-avatar__eye" d="M 85 58 L 95 58 A 5 5 0 0 1 85 58 Z" fill="#111827" />
          <line
            class="duck-avatar__eye-lid"
            x1="83"
            y1="58"
            x2="97"
            y2="58"
            stroke="#111827"
            stroke-width="1.5"
            stroke-linecap="round"
          />

          <path
            class="duck-avatar__eye"
            d="M 107 58 L 117 58 A 5 5 0 0 1 107 58 Z"
            fill="#111827"
          />
          <line
            class="duck-avatar__eye-lid"
            x1="105"
            y1="58"
            x2="119"
            y2="58"
            stroke="#111827"
            stroke-width="1.5"
            stroke-linecap="round"
          />

          <!-- Sourcils (un haut, un bas) -->
          <path
            class="duck-avatar__brow"
            d="M 84 45 Q 90 42 96 45"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
          <path
            class="duck-avatar__brow"
            d="M 107 52 L 117 52"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
        </g>

        <!-- Étoile ironique -->
        <path
          class="duck-avatar__sparkle"
          d="M 135 30 Q 135 40 125 40 Q 135 40 135 50 Q 135 40 145 40 Q 135 40 135 30 Z"
          fill="#ffffff"
          stroke="#111827"
          stroke-width="1.5"
        />
      </svg>

    @case ('empathetic') {
      <svg
        class="duck-avatar__svg duck-avatar__svg--empathetic"
        viewBox="0 0 160 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"

        <!-- Petit cœur flottant -->
        <path
          class="duck-avatar__heart"
          d="M 32 30 A 4 4 0 0 1 40 30 A 4 4 0 0 1 48 30 Q 48 35 40 42 Q 32 35 32 30 Z"
          fill="#f9a8d4"
          stroke="#111827"
          stroke-width="1.5"
          stroke-linejoin="round"
        />

        <!-- Pattes -->
        <path
          class="duck-avatar__leg"
          d="M 60 135 L 60 148 L 68 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          class="duck-avatar__leg"
          d="M 85 135 L 85 148 L 93 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Corps et Queue -->
        <path
          class="duck-avatar__tail"
          d="M 35 115 Q 15 105 20 85 Q 35 90 45 95 Z"
          fill="#ffd54a"
        />
        <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

        <!-- Aile tendue vers l'avant (câlin) -->
        <path
          class="duck-avatar__wing"
          d="M 55 95 Q 75 90 85 105"
          fill="none"
          stroke="#f59e0b"
          stroke-width="4"
          stroke-linecap="round"
        />

        <!-- Tête -->
        <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

        <!-- Blush -->
        <circle class="duck-avatar__blush" cx="82" cy="66" r="6" fill="#f9a8d4" opacity="0.6" />
        <circle class="duck-avatar__blush" cx="120" cy="66" r="6" fill="#f9a8d4" opacity="0.6" />

        <!-- Bec avec sourire doux -->

          class="duck-avatar__beak"
          d="M 110 60 C 125 60 135 62 132 68 C 128 74 115 74 108 72 C 105 66 105 62 110 60 Z"
          fill="#f59e0b"
        />
        <path

          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"

        <!-- Yeux grands et doux -->

        <circle class="duck-avatar__sparkle" cx="89" cy="56" r="2.5" fill="#ffffff" />
        <circle class="duck-avatar__sparkle" cx="92" cy="60" r="1" fill="#ffffff" />

        <circle class="duck-avatar__eye" cx="112" cy="58" r="6" fill="#111827" />
        <circle class="duck-avatar__sparkle" cx="111" cy="56" r="2.5" fill="#ffffff" />
        <circle class="duck-avatar__sparkle" cx="114" cy="60" r="1" fill="#ffffff" />

          fill="none"
          stroke-linecap="round"
        />
        <path
          class="duck-avatar__brow"
          d="M 106 49 Q 112 44 118 48"
          stroke="#111827"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"

    @case ('confused') {

          d="M 40 30 C 45 20 60 20 60 30 C 60 40 45 40 45 30 C 45 25 52 25 52 30"
          stroke="#111827"
          stroke-width="2"

        />

        <!-- Pattes -->
        <path
          class="duck-avatar__leg"
          d="M 60 135 L 60 148 L 68 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          class="duck-avatar__leg"
          d="M 85 135 L 85 148 L 93 148"
          stroke="#f59e0b"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"

        />
        <ellipse class="duck-avatar__body" cx="70" cy="105" rx="45" ry="40" fill="#ffd54a" />

        <!-- Aile -->
        <path
          class="duck-avatar__wing"
          d="M 50 95 C 40 115, 60 125, 80 115"
          fill="none"
          stroke="#f59e0b"
          stroke-width="4"
          stroke-linecap="round"
        />

          <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

          <path
            class="duck-avatar__beak"

          />

          <path
            class="duck-avatar__mouth"
            d="M 108 67 C 112 64 116 70 120 67 C 124 64 128 70 130 67"
            stroke="#111827"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle class="duck-avatar__eye" cx="112" cy="58" r="6" fill="#111827" />

        <path

        <path
          class="duck-avatar__leg"

        <path
          class="duck-avatar__wing"
          d="M 50 95 Q 35 65 40 55 Q 50 60 65 85"
          fill="#ffd54a"
          stroke="#f59e0b"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <circle class="duck-avatar__head" cx="95" cy="65" r="34" fill="#ffd54a" />

          class="duck-avatar__beak"

        />
        <path class="duck-avatar__mouth" d="M 110 67 C 115 80 125 80 130 67 Z" fill="#111827" />

          class="duck-avatar__eye-arc"
          d="M 84 58 Q 90 52 96 58"
