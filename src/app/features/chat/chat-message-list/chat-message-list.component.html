<div class="chat-message-list-shell">
  <div
    #scrollViewport
    class="chat-message-list"
    role="log"
    aria-live="polite"
    aria-label="Historique des messages"
    (scroll)="onScroll()"
  >
    @for (message of messages(); track message.id) {
      @if (message.author === 'duck') {
        <app-duck-message-bubble [message]="message"></app-duck-message-bubble>
      } @else {
        <app-user-message-bubble [message]="message"></app-user-message-bubble>
      }
    }
  </div>

  @if (showNewMessageIndicator()) {
    <button
      type="button"
      class="chat-message-list__new-message-indicator"
      (click)="scrollToBottom()"
      aria-label="Aller au nouveau message"
    >
      ↓ Nouveau message
    </button>
  }
</div>
